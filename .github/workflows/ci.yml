name: ci

# push/PR guard the driver itself; workflow_dispatch is how dsh-release-watch
# re-runs the suite (and the per-channel DSH compat matrix) on a new DSH release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm test

  dsh-release-compat:
    name: dsh ${{ matrix.channel }} compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, next, alpha]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve the DSH release for this channel
        run: |
          VERSION=$(npm view @deepseek-ai/dsh dist-tags.${{ matrix.channel }})
          test -n "$VERSION"
          echo "DSH_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Testing against @deepseek-ai/dsh@$VERSION (${{ matrix.channel }})"
      - run: node --test test/dsh-compat.test.mjs
      - name: Check the catalog adapter against this release's LlmAdapter
        run: |
          # dsh-llm is released in lockstep with dsh (same version).
          mkdir -p /tmp/dsh-llm && cd /tmp/dsh-llm
          npm pack "@deepseek-ai/dsh-llm@$DSH_VERSION" --silent >/dev/null
          tar -xzf deepseek-ai-dsh-llm-*.tgz
          echo "DSH_LLM_TYPES=/tmp/dsh-llm/package/lib/types/index.d.ts" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: node --test test/adapter-contract.test.mjs

  install:
    runs-on: ubuntu-latest
    env:
      DSH: /tmp/dsh-cli/node_modules/.bin/dsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: mkdir -p /tmp/dsh-cli && cd /tmp/dsh-cli && pnpm init -y > /dev/null && pnpm add @deepseek-ai/dsh@latest --allow-build @deepseek-ai/dsh-subprocess-local --allow-build @google/genai --allow-build koffi --allow-build node-pty --allow-build protobufjs
      - run: $DSH plugin --profile ci-claude add .
      - run: $DSH --profile ci-claude --dump-config | grep claude-driver
      # Tarball installs only see `files`-whitelisted content.
      - run: mkdir -p /tmp/claude-pkg && npm pack --pack-destination /tmp/claude-pkg
      - run: $DSH plugin --profile ci-claude-pack add /tmp/claude-pkg/*.tgz
      - run: $DSH --profile ci-claude-pack --dump-config | grep claude-driver

  no-binary-install:
    # The plugin installed WITHOUT the SDK's optional platform binary must still
    # find nothing to run until the driver installs it, and then install it once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --omit=optional --no-audit --no-fund
      - run: test ! -e node_modules/@anthropic-ai/claude-agent-sdk-linux-x64
      - name: Install the CLI through the driver, then check it again installs nothing
        run: |
          export DSH_HOME=$RUNNER_TEMP/dsh
          node -e "
          import('./lib/deps.js').then(async (m) => {
            const env = { ...process.env, PATH: '/usr/bin:/bin:' + require('node:path').dirname(process.execPath) }
            const first = await m.ensureClaudeCli({ env })
            console.log('first :', JSON.stringify(first))
            if (first.action !== 'installed') process.exit(1)
            const second = await m.ensureClaudeCli({ env })
            console.log('second:', JSON.stringify(second))
            if (second.action !== 'none') process.exit(2)
          })"
